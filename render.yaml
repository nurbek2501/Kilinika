# ─────────────────────────────────────────────────────────────
# Render Blueprint — KDC (Kamoliddin Dental Clinic)
#
# One Postgres + backend API (with embedded Telegram bot) + Next.js frontend.
#
# Deploy:
#   1. Push this repo to GitHub/GitLab (see root .gitignore — never commit .env).
#   2. Render dashboard → New + → Blueprint → pick this repo.
#   3. Fill in every `sync: false` variable (secrets) when prompted.
#   4. First deploy builds the DB schema and seeds the default accounts/services.
#
# NOTE: `runtime: node` is the current field name; on older Render use `env: node`.
# ─────────────────────────────────────────────────────────────

databases:
  - name: kdc-postgres
    databaseName: dental
    user: dental
    plan: free            # Free Postgres is deleted after 90 days — upgrade for production.

services:
  # ── Backend API + embedded Telegram bot ──────────────────────
  - type: web
    name: kdc-backend
    runtime: node
    rootDir: backend
    plan: free            # Free web services sleep when idle (bot pauses too). Use Starter for always-on.
    healthCheckPath: /api/health
    # Generate Prisma client, sync the schema, seed defaults (idempotent), then compile.
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run seed && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Tashkent
      # PORT is injected by Render automatically; server.ts reads process.env.PORT.
      - key: DATABASE_URL
        fromDatabase:
          name: kdc-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Must equal the frontend's public URL for CORS to pass. Update if the
      # frontend gets a different .onrender.com name.
      - key: CORS_ORIGIN
        value: https://kdc-frontend.onrender.com
      # ── Secrets — set these in the Render dashboard (required before first deploy) ──
      - key: TELEGRAM_BOT_TOKEN     # enables @your_bot; leave blank to keep the bot off
        sync: false
      - key: DIRECTOR_NAME
        sync: false
      - key: DIRECTOR_PHONE
        sync: false
      - key: DIRECTOR_PASSWORD     # REQUIRED in production (env.ts fails fast without it)
        sync: false
      - key: DOCTOR1_NAME
        sync: false
      - key: DOCTOR1_PHONE
        sync: false
      - key: DOCTOR1_PASSWORD      # REQUIRED in production
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ESKIZ_EMAIL           # optional (Eskiz SMS)
        sync: false
      - key: ESKIZ_PASSWORD
        sync: false

  # ── Frontend (Next.js) ───────────────────────────────────────
  - type: web
    name: kdc-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # NEXT_PUBLIC_* is baked into the bundle at build time, so it must be the
      # real backend URL BEFORE the frontend builds. Update + redeploy if the
      # backend URL differs from the name below.
      - key: NEXT_PUBLIC_API_URL
        value: https://kdc-backend.onrender.com/api
